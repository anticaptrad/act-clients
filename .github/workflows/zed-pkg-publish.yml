name: Zed-Pkg Validation

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the single root package envelope
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path(".")
          manifests = sorted(
              path for path in root.rglob(".zpkg.toml")
              if ".git" not in path.parts and ".vendor" not in path.parts
          )
          if manifests != [Path(".zpkg.toml")]:
              raise SystemExit(
                  "expected exactly the root .zpkg.toml; found "
                  + ", ".join(map(str, manifests))
              )

          with Path(".zpkg.toml").open("rb") as handle:
              manifest = tomllib.load(handle)
          package = manifest.get("package", {})
          required = {"org", "name", "version"}
          missing = required - set(package)
          if missing:
              raise SystemExit(f"root package is missing fields: {sorted(missing)}")
          if package["org"] != "anticaptrad" or package["name"] != "act-clients":
              raise SystemExit("unexpected package identity")

          if Path(".zpkg.lock").read_text(encoding="utf-8").strip() != "version = 1":
              raise SystemExit(".zpkg.lock must contain exactly 'version = 1'")

          for target, section in manifest.get("targets", {}).items():
              directory = Path(section["dir"])
              if not directory.is_dir():
                  raise SystemExit(f"target {target!r} points at missing directory {directory}")

          print(f"validated {package['org']}/{package['name']} v{package['version']}")
          PY
