name: Native package smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Test and pack npm package
        working-directory: clients/typescript
        run: |
          npm test
          npm pack --dry-run

      - name: Test and package Cargo crate
        run: |
          cargo fmt --manifest-path clients/rust/Cargo.toml --check
          cargo clippy --locked --manifest-path clients/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path clients/rust/Cargo.toml
          cargo package --locked --manifest-path clients/rust/Cargo.toml --allow-dirty

      - name: Test and validate pub.dev package
        working-directory: clients/dart
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test
          dart analyze
          dart test
          dart pub publish --dry-run
