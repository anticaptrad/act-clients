name: Zed package interoperability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out package source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Check out current certified Zed CLI
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-cli
          ref: 5d1d13119be5784f545a7d812cdfaae3ca120693
          path: zed-cli
          persist-credentials: false

      - name: Check out matching Zed interfaces
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: 92f046e393e7b421e9eea1afcc6c028ff8eb5859
          path: zed-interfaces
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure isolated output
        run: echo "ZED_PACK_OUT=$RUNNER_TEMP/zed-pack" >> "$GITHUB_ENV"

      - name: Validate package metadata
        working-directory: source
        run: python scripts/validate-zed-package.py --manifest-only

      - name: Pack every Zed target
        working-directory: source
        run: |
          cargo run --quiet --locked --manifest-path ../zed-cli/Cargo.toml --bin zed -- \
            pack --out "$ZED_PACK_OUT"

      - name: Verify repository and isolated language artifacts
        working-directory: source
        run: python scripts/validate-zed-package.py --artifacts "$ZED_PACK_OUT"

      - name: Validate coordinated native and forge release plan
        working-directory: source
        run: cargo run --quiet --locked --manifest-path ../zed-cli/Cargo.toml --bin zed -- release plan

      - name: Exercise publish planning without uploading
        working-directory: source
        run: |
          cargo run --quiet --locked --manifest-path ../zed-cli/Cargo.toml --bin zed -- \
            publish --dry-run --skip-vcs-checks
