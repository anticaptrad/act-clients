name: Zed package contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-package-contract.py

  typescript-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build and test the native TypeScript package
        working-directory: clients/typescript
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
          npm run build --if-present
          npm test --if-present
      - name: Import under Node, Deno, and Bun
        run: |
          node test/runtime-import-smoke.mjs
          deno run --allow-read test/runtime-import-smoke.mjs
          bun run test/runtime-import-smoke.mjs
      - name: Install local edge runtime
        working-directory: clients/typescript
        run: npm install --no-save wrangler@4
      - run: node test/run-edge-smoke.mjs
