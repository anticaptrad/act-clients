[package]
org = "anticaptrad"
name = "act-clients"
version = "0.1.0"
description = "Official polyglot clients for Anticapitalist Tradition"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "anticaptrad"]

[package.repository]
vcs = "git"
url = "https://github.com/anticaptrad/act-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"anticaptrad/act-interfaces" = "^0.1.0"

[workspace]
members = ["clients/*"]

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".vendor/.zed/**", "**/target/**", "**/node_modules/**", "**/.dart_tool/**", "**/.gradle/**", "**/build/**", "benches/**"]

[targets.repository]
dir = "."
name = "act-clients-repository"

[targets.nodejs]
dir = "clients/typescript"
name = "act-clients-nodejs"
adapter = "node"

[targets.nodejs.native]
registry = "npm"
package = "@anticaptrad/client"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.golang]
dir = "clients/go"
adapter = "go"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "anticaptrad-client"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.dart.native]
registry = "pub.dev"
package = "anticaptrad_client"

[targets.gleam]
dir = "clients/gleam"
adapter = "none"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.swift]
dir = "clients/swift"
