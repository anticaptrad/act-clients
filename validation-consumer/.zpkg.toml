[package]
org = "anticaptrad"
name = "act-validation-consumer"
version = "0.1.0"
description = "Client adapters for act-lib-core public validation SDKs"
license = "MIT"

[dependencies]
"anticaptrad/act-lib-core" = "^0.1.0"
"anticaptrad/act-interfaces" = "^0.1.0"

[targets.typescript]
dir = "typescript"
adapter = "node"

[targets.rust]
dir = "rust"
adapter = "rust"

[targets.golang]
dir = "golang"
adapter = "none"

[targets.gleam]
dir = "gleam"
adapter = "none"
