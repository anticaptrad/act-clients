[package]
name = "anticaptrad-client"
version = "0.1.0"
edition = "2024"
description = "Rust client for Anticapitalist Tradition service probes"
license = "MIT"
repository = "https://github.com/anticaptrad/act-clients"
readme = "README.md"
keywords = ["anticaptrad", "client", "api"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ureq = { version = "3", features = ["json"] }
